<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#800521" />
  <link rel="icon" type="image/jpeg" href="/SFA-Logo.jpeg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>IESTP San Francisco de Asís</title>
</head>

<body>
  <div id="root">
    <!-- 🛡️ Splash Loader Ultraligero Inline (Elimina la pantalla blanca en menos de 50ms) -->
    <div style="
      position: fixed;
      inset: 0;
      background-color: #800521;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 9999;
      color: #ffffff;
    ">
      <img 
        src="/SFA-Logo.jpeg" 
        alt="IESTP San Francisco de Asís" 
        style="height: 64px; width: 64px; border-radius: 14px; margin-bottom: 18px; object-fit: cover; box-shadow: 0 6px 16px rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.25);" 
      />
      <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; color: #fde68a;">
        IESTP San Francisco de Asís
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #ffffff; opacity: 0.8; animation: sfa_bounce 0.6s infinite alternate ease-in-out;"></div>
        <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #ffffff; opacity: 0.8; animation: sfa_bounce 0.6s infinite 0.2s alternate ease-in-out;"></div>
        <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #ffffff; opacity: 0.8; animation: sfa_bounce 0.6s infinite 0.4s alternate ease-in-out;"></div>
      </div>
      <style>
        @keyframes sfa_bounce {
          from { transform: translateY(0); opacity: 0.35; }
          to { transform: translateY(-8px); opacity: 1; }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
